<!doctype html>
<!-- One Adsterra banner, loaded by AdSlot inside a sandboxed iframe. Served from our domain (not
     srcdoc) so the ad request carries our domain as its referrer, which Adsterra requires. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style>
  </head>
  <body>
    <script>
      (function () {
        var q = new URLSearchParams(location.search)
        var key = q.get("k") || ""
        var w = Number(q.get("w")), h = Number(q.get("h"))
        if (!/^[a-f0-9]{32}$/.test(key) || !(w > 0 && w <= 1000) || !(h > 0 && h <= 1000)) return
        window.atOptions = { key: key, format: "iframe", height: h, width: w, params: {} }
        // Written during parsing (not appended later): the banner script uses document.write.
        document.write('<script src="https://bauval.org/22/' + key + '"><\/script>')
      })()
    </script>
  </body>
</html>
